<!doctype html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="./favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06100c">
  <meta name="description" content="GhostOS, un système d'exploitation fictif à explorer dans votre navigateur.">
  <title>GhostOS // bureau</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body data-theme="green" data-crt="on">
  <div class="boot-screen" id="boot-screen" aria-label="Démarrage de GhostOS">
    <div class="boot-content">
      <div class="boot-mark">G<span>_</span></div>
      <p class="boot-title">GHOST<span>OS</span></p>
      <p class="boot-message" id="boot-message">INITIALISATION DU NOYAU...</p>
      <div class="boot-track"><i id="boot-progress"></i></div>
      <div class="boot-meta"><span>SIMULATION 09.04</span><span>BUILD 1997.10</span></div>
    </div>
  </div>
  <main class="desktop" id="desktop" aria-label="Bureau GhostOS">
    <div class="desktop-topline"><span id="desktop-title">GHOSTOS <b>2.7.04</b></span><span class="desktop-location" id="desktop-location">SECTEUR LOCAL // SESSION PRIVÉE</span><button class="return-desktop" id="return-desktop" type="button" hidden>RETOUR AU BUREAU NORMAL</button></div>
    <div class="desktop-icons" id="desktop-icons" aria-label="Applications"></div>
    <div class="desktop-icons restricted-icons" id="restricted-icons" aria-label="Applications restreintes" hidden></div>
    <section class="window-layer" id="window-layer" aria-live="polite"></section>
    <div class="notification-stack" id="notifications" aria-live="polite"></div>
    <footer class="taskbar">
      <button class="start-button" id="start-button" aria-label="Ouvrir le menu principal" aria-expanded="false"><span class="start-glyph" id="start-glyph">G</span><span id="start-label">GHOST</span></button>
      <div class="task-list" id="task-list" aria-label="Fenêtres ouvertes"></div>
      <div class="tray">
        <button class="tray-status" id="system-status" title="État du système"><i></i><span>EN LIGNE</span></button>
        <time id="clock" aria-label="Heure"></time>
      </div>
      <div class="start-menu" id="start-menu" hidden>
        <div class="menu-heading"><span id="menu-title">GHOSTOS</span><small id="menu-subtitle">SESSION INVITÉ</small></div>
        <div class="menu-apps" id="menu-apps"></div>
        <div class="menu-footer"><span id="menu-footer-label">SIMULATION LOCALE</span><button id="menu-restricted" hidden>BUREAU INTERDIT</button><button id="menu-settings">PARAMÈTRES</button></div>
      </div>
    </footer>
  </main>
</body>
</html>
